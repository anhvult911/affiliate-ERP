name: Deploy

# Runs only after CI succeeded for a push to main, or manually from the Actions tab.
# CI failing means nothing reaches the box: the deploy job uses workflow_run, so a red
# typecheck/test/schema run is a hard stop rather than a race with the build.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: ssh → build → restart → health check
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_HOST" ]; then
            echo "DEPLOY_SSH_KEY / DEPLOY_HOST secrets are not configured" >&2
            exit 1
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Trust on first use: the host is a fixed VPS, and the fingerprint is stable
          # across runs. Replace with a DEPLOY_KNOWN_HOSTS secret if the box is rebuilt.
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # The script runs on the VPS, as `deploy`, and does its own rollback.
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "deploy@$DEPLOY_HOST" \
            "bash /opt/affiliate-erp/scripts/deploy-vps.sh origin/main"
