name: Deploy

# Runs only after CI succeeded for a push to main, or manually from the Actions tab.
# CI failing means nothing reaches the box: the deploy job uses workflow_run, so a red
# typecheck/test/schema run is a hard stop rather than a race with the build.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: ssh → build → restart → health check
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          # Repo variable so a rebuilt box can live anywhere without editing this file.
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/affiliate-erp' }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_HOST" ]; then
            echo "DEPLOY_SSH_KEY / DEPLOY_HOST secrets are not configured" >&2
            exit 1
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Trust on first use: the host is a fixed VPS, and the fingerprint is stable
          # across runs. Replace with a DEPLOY_KNOWN_HOSTS secret if the box is rebuilt.
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          SSH="ssh -i $HOME/.ssh/id_ed25519 -o BatchMode=yes deploy@$DEPLOY_HOST"

          # A wrong DEPLOY_PATH must say so, with the real directory listing: otherwise
          # the job fails with a bare "No such file or directory" and nothing to act on.
          if ! $SSH "test -f '$DEPLOY_PATH/scripts/deploy-vps.sh'"; then
            echo "deploy script not found at $DEPLOY_PATH/scripts/deploy-vps.sh" >&2
            echo "set the DEPLOY_PATH repository variable to the real checkout (gh variable set DEPLOY_PATH --body <path>)" >&2
            $SSH "ls -la '$DEPLOY_PATH' 2>&1 | head -20" >&2 || true
            exit 1
          fi

          # The script runs on the VPS, as `deploy`, and does its own rollback.
          $SSH "APP_DIR='$DEPLOY_PATH' bash '$DEPLOY_PATH/scripts/deploy-vps.sh' origin/main"
